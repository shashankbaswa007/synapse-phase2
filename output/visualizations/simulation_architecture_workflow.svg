<text x="55" y="119" fill="#93c5fd" font-size="12" font-weight="700">1. Demographic Initialization</text>
<text x="55" y="146" fill="#f1f5f9" font-size="11.5" font-weight="600">• SRS 2021 Census Stratification</text>
<text x="55" y="166" fill="#94a3b8" font-size="10.5">• Age (5 bands), Sex (51.5% M / 48.5% F)</text>
<text x="55" y="184" fill="#94a3b8" font-size="10.5">• Baseline BMI, SBP, Glycemia Profile</text>
<text x="55" y="202" fill="#38bdf8" font-size="10.5">Output: 10,000 PatientContexts</text>
