<rect x="370" y="100" width="300" height="28" rx="10" fill="#164e63"/>
<text x="385" y="119" fill="#67e8f9" font-size="12" font-weight="700">3. Encounters & Stepped Care</text>
<text x="385" y="146" fill="#f1f5f9" font-size="11.5" font-weight="600">• Symptom Triggers & Routine OPD</text>
<text x="385" y="164" fill="#94a3b8" font-size="10.5">• ICMR STG 2022 Guidelines Enforced</text>
<text x="385" y="182" fill="#94a3b8" font-size="10.5">• 1st Line: Amlodipine, Metformin, Amox</text>
<text x="385" y="200" fill="#94a3b8" font-size="10.5">• Intensification: Telmisartan, Glimepiride</text>
<text x="385" y="220" fill="#ec4899" font-size="10.5">• Safety: Allergy Veto (RULE-CLIN-ALLERGY-001)</text>
