<text x="55" y="514" fill="#94a3b8" font-size="10.5">• Crude Rate: 0.01311/pt-yr</text>
<text x="55" y="534" fill="#f43f5e" font-size="10.5">• Output: deaths.csv (255 deceased)</text>
