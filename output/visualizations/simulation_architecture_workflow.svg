<rect x="370" y="280" width="300" height="28" rx="10" fill="#064e3b"/>
<text x="385" y="299" fill="#6ee7b7" font-size="12" font-weight="700">4. Hemodynamics & Survey Protocol</text>
<text x="385" y="326" fill="#f1f5f9" font-size="11.5" font-weight="600">• Engine: LEGACY_CONDITIONAL (Default)</text>
<text x="385" y="344" fill="#94a3b8" font-size="10.5">• Engine: FORWARD_STATE_SPACE (Experimental)</text>
<text x="385" y="364" fill="#f1f5f9" font-size="11" font-weight="600">• Protocol: LASI_WAVE1_TRI_MEASUREMENT</text>
<text x="385" y="382" fill="#94a3b8" font-size="10.5">• Day 360 Survey Wave (N=2,638 age 45+)</text>
<text x="385" y="400" fill="#94a3b8" font-size="10.5">• Triplicate Seated Readings (7,914 readings)</text>
<text x="385" y="420" fill="#10b981" font-size="10.5">• Invariants: SBP > DBP, PP >= 20 mmHg</text>
