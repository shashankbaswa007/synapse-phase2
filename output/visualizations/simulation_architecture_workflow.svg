<text x="55" y="289" fill="#c4b5fd" font-size="12" font-weight="700">2. Synthea State Machines</text>
<text x="55" y="316" fill="#f1f5f9" font-size="11.5" font-weight="600">• YAML-Driven Progression</text>
<text x="55" y="334" fill="#94a3b8" font-size="10.5">• Hypertension (Essential -> Nephropathy)</text>
<text x="55" y="352" fill="#94a3b8" font-size="10.5">• Type 2 Diabetes (Uncomplicated -> Renal)</text>
<text x="55" y="370" fill="#94a3b8" font-size="10.5">• Acute URTI (720-day Multi-Wave Attack)</text>
<text x="55" y="390" fill="#a78bfa" font-size="10.5">Evaluated: Timestep = 7 Days</text>
