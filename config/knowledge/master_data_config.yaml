# ==============================================================================
# SYNAPSE V1 — Master Data Configuration
# ==============================================================================
# Hospital reference data: departments, staff, rooms, initial inventory.
# Generated ONCE per simulation run before patient journeys begin.
# ==============================================================================

departments:
  - id: "DEPT-CLIN"
    name: "Outpatient Clinical Services"
    type: "clinical"
    floor: 1
    rooms:
      count: 10
      prefix: "OPD"
    staff:
      doctors: 5
      nurses: 8

  - id: "DEPT-PHARM"
    name: "Pharmacy"
    type: "pharmacy"
    floor: 0
    rooms:
      count: 2
      prefix: "PHR"
    staff:
      pharmacists: 3
      pharmacy_technicians: 2

  - id: "DEPT-LAB"
    name: "Pathology Laboratory"
    type: "laboratory"
    floor: -1
    rooms:
      count: 3
      prefix: "LAB"
    staff:
      pathologists: 2
      lab_technicians: 4

  - id: "DEPT-RAD"
    name: "Radiology & Imaging"
    type: "radiology"
    floor: -1
    rooms:
      count: 3
      prefix: "RAD"
    staff:
      radiologists: 2
      rad_technicians: 3

  - id: "DEPT-FIN"
    name: "Finance & Billing"
    type: "finance"
    floor: 0
    rooms:
      count: 2
      prefix: "FIN"
    staff:
      billing_clerks: 3

specializations:
  - "General Medicine"
  - "Internal Medicine"
  - "Pediatrics"
  - "Orthopedics"
  - "Pulmonology"

