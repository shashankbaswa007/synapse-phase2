# ------------------------------------------------------------------------------
# DRUG-ALLERGY CROSS-REACTIVITY MATRIX
# ------------------------------------------------------------------------------
drug_allergy_matrix:
  Penicillin:
    cross_reactive_classes: ["Beta-Lactam"]
    cross_reactive_drugs: ["Amoxicillin", "Ampicillin", "Cephalexin"]
    safe_alternatives:
      - drug: "Azithromycin"
        drug_class: "Macrolide"
      - drug: "Levofloxacin"
        drug_class: "Fluoroquinolone"
  Sulfonamide:
    cross_reactive_classes: ["Sulfonamide"]
    cross_reactive_drugs: ["Sulfamethoxazole", "Sulfasalazine"]
    safe_alternatives:
      - drug: "Ciprofloxacin"
        drug_class: "Fluoroquinolone"
  NSAID:
    cross_reactive_classes: ["NSAID"]
    cross_reactive_drugs: ["Ibuprofen", "Diclofenac", "Aspirin"]
    safe_alternatives:
      - drug: "Paracetamol"
        drug_class: "Analgesic"

