# ------------------------------------------------------------------------------
# LABORATORY TEST REFERENCE RANGES
# ------------------------------------------------------------------------------
lab_test_ranges:
  CBC:
    components:
      - name: "Hemoglobin"
        unit: "g/dL"
        normal_range: [12.0, 17.5]
        critical_low: 7.0
        critical_high: 20.0
      - name: "WBC"
        unit: "x10^3/uL"
        normal_range: [4.5, 11.0]
        critical_low: 2.0
        critical_high: 30.0
      - name: "Platelet_Count"
        unit: "x10^3/uL"
        normal_range: [150, 400]
        critical_low: 50
        critical_high: 1000
      - name: "RBC"
        unit: "x10^6/uL"
        normal_range: [4.0, 5.5]
        critical_low: 2.5
        critical_high: 7.0
  CRP:
    components:
      - name: "C-Reactive_Protein"
        unit: "mg/L"
        normal_range: [0.0, 5.0]
        critical_low: 0.0
        critical_high: 200.0
  ESR:
    components:
      - name: "Erythrocyte_Sedimentation_Rate"
        unit: "mm/hr"
        normal_range: [0, 20]
        critical_low: 0
        critical_high: 120
  Lipid_Panel:
    components:
      - name: "Total_Cholesterol"
        unit: "mg/dL"
        normal_range: [125, 200]
        critical_low: 100
        critical_high: 400
      - name: "LDL"
        unit: "mg/dL"
        normal_range: [0, 100]
        critical_low: 0
        critical_high: 250
      - name: "HDL"
        unit: "mg/dL"
        normal_range: [40, 60]
        critical_low: 20
        critical_high: 100
      - name: "Triglycerides"
        unit: "mg/dL"
        normal_range: [0, 150]
        critical_low: 0
        critical_high: 500
  FBS:
    components:
      - name: "Fasting_Blood_Sugar"
        unit: "mg/dL"
        normal_range: [70, 100]
        critical_low: 40
        critical_high: 400
  HbA1c:
    components:
      - name: "Glycated_Hemoglobin"
        unit: "%"
        normal_range: [4.0, 5.6]
        critical_low: 3.0
        critical_high: 14.0
  Renal_Function:
    components:
      - name: "Creatinine"
        unit: "mg/dL"
        normal_range: [0.6, 1.2]
        critical_low: 0.3
        critical_high: 10.0
      - name: "BUN"
        unit: "mg/dL"
        normal_range: [7, 20]
        critical_low: 3
        critical_high: 100
  Liver_Function:
    components:
      - name: "ALT"
        unit: "U/L"
        normal_range: [7, 56]
        critical_low: 0
        critical_high: 1000
      - name: "AST"
        unit: "U/L"
        normal_range: [10, 40]
        critical_low: 0
        critical_high: 1000
  Urinalysis:
    components:
      - name: "pH"
        unit: ""
        normal_range: [4.5, 8.0]
        critical_low: 4.0
        critical_high: 9.0
      - name: "Specific_Gravity"
        unit: ""
        normal_range: [1.005, 1.030]
        critical_low: 1.001
        critical_high: 1.040
  Urine_Culture:
    components:
      - name: "Colony_Count"
        unit: "CFU/mL"
        normal_range: [0, 10000]
        critical_low: 0
        critical_high: 1000000

