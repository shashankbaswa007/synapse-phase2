      - "Bilateral infiltrates suggestive of pneumonia."
      - "Right lower lobe consolidation."
      - "Mild cardiomegaly with pulmonary congestion."
  X-Ray_Lumbar_Spine:
    normal: "Normal lumbar spine alignment. No fractures or dislocations. Preserved disc spaces."
    abnormal:
      - "Mild degenerative changes at L4-L5."
      - "Reduced disc space height at L5-S1."
  CT_Head:
    normal: "No acute intracranial abnormality. Normal ventricles and cisterns."
    abnormal:
      - "No acute intracranial hemorrhage or infarction."
  CT_Abdomen:
    normal: "Unremarkable CT of the abdomen and pelvis."
    abnormal:
      - "Mild hepatomegaly."
      - "Small gallstone noted without cholecystitis."

